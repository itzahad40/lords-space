name: Build APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Two JDKs: 17 is needed by the Android sdkmanager, 11 is needed by this old project (Gradle 7.0.2 / AGP 7.0.2).
      # The last one listed (17) becomes the default JAVA_HOME; the build step switches to 11 explicitly.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            17

      # No third-party SDK action: install the Android command-line tools ourselves, then the packages we need.
      - name: Install Android SDK (API 33, build-tools 31.0.0, NDK 21, CMake 3.10.2)
        run: |
          set -e
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          java -version
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-33" "build-tools;31.0.0" "ndk;21.4.7075529" "cmake;3.10.2"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK (JDK 11)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: |
          java -version
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Lords-Space-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
