name: Build APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: android-actions/setup-android@v3

      - name: Install SDK parts (API 33, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "build-tools;31.0.0" "ndk;21.4.7075529" "cmake;3.10.2"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Lords-Space-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
